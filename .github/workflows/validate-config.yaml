# Ref: https://github.com/scottames/copr/blob/main/.github/workflows/renovate-config-validator.yaml

name: Validate Config
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/renovate.json
      - .github/renovate-bot.json
      - .github/workflows/run-renovate.yml
  push:
    branches:
      - main
    paths:
      - .github/renovate.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-config:
    name: Validate Renovate Config
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        config:
          - .github/renovate.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: suzuki-shunsuke/github-action-renovate-config-validator@b850926b611b1f3d3fe3729776339c217834bf2c # v2.2.0
        with:
          config_file_path: ${{ matrix.config }}
